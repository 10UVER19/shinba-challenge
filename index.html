<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#093494">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="新馬戦">
  <title>新馬戦チャレンジ</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/app-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/app-icon-180.png">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/story.css">
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <p class="eyebrow">SHINBA CHALLENGE</p>
      <h1>新馬戦チャレンジ</h1>
      <p class="header-note">当日の新馬戦を選んでStoryを作成</p>
      <p id="network-status" class="network-status" role="status" hidden>オフラインです。履歴の閲覧・編集はできますが、netkeiba連携はオンラインで実行してください。</p>
      <div class="app-header-actions">
        <button id="reset-day-data-button" class="reset-data-button" type="button">当日データをリセット</button>
      </div>
    </header>

    <main id="app" class="app-main" aria-live="polite"></main>
  </div>

  <div id="zero-rating-dialog" class="dialog-backdrop" hidden>
    <section class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="dialog-title" aria-describedby="dialog-message">
      <h2 id="dialog-title">参加しない設定です</h2>
      <p id="dialog-message">3項目すべて☆☆☆☆☆です。このレースは参加しない設定で進みますか？</p>
      <div class="dialog-actions">
        <button id="dialog-cancel" class="button button-secondary" type="button">評価を戻す</button>
        <button id="dialog-confirm" class="button button-primary" type="button">このまま進む</button>
      </div>
    </section>
  </div>

  <div id="reset-data-dialog" class="dialog-backdrop" hidden>
    <section class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="reset-dialog-title" aria-describedby="reset-dialog-message">
      <h2 id="reset-dialog-title">当日データをリセットしますか？</h2>
      <p id="reset-dialog-message">新馬戦一覧、選択状態、評価、Pythonista連携状態、メモなど、このアプリの保存データを削除します。</p>
      <div class="dialog-actions">
        <button id="reset-dialog-cancel" class="button button-secondary" type="button">キャンセル</button>
        <button id="reset-dialog-confirm" class="button button-danger" type="button">リセットする</button>
      </div>
    </section>
  </div>

  <script src="js/app-config.js" defer></script>
  <script src="js/race-data.js" defer></script>
  <script src="js/validation.js" defer></script>
  <script src="js/rating.js" defer></script>
  <script src="js/race-importer.js" defer></script>
  <script src="js/race-batch-importer.js" defer></script>
  <script src="js/newcomer-list.js" defer></script>
  <script src="js/bet-plan.js" defer></script>
  <script src="js/memo-sync.js" defer></script>
  <script src="js/history-model.js" defer></script>
  <script src="js/history-store.js" defer></script>
  <script src="vendor/html2canvas-1.4.1.min.js" defer></script>
  <script src="js/png-exporter.js" defer></script>
  <script src="js/story-renderer.js" defer></script>
  <script src="js/app.js" defer></script>
</body>
</html>
